name: Manual Build

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    - name: Validate Gradle wrapper
      uses: gradle/actions/wrapper-validation@v4
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Inject credentials
      run: |
        cat <<EOF > local.properties
        POSTHOG_API_KEY=${{ secrets.POSTHOG_API_KEY || 'dummy' }}
        POSTHOG_HOST=${{ secrets.POSTHOG_HOST || 'https://us.i.posthog.com' }}
        STEAMGRIDDB_API_KEY=${{ secrets.STEAMGRIDDB_API_KEY || 'dummy' }}
        CLOUD_PROJECT_NUMBER=${{ secrets.CLOUD_PROJECT_NUMBER || '0' }}
        ITCH_IO_CLIENT_ID=${{ secrets.ITCH_IO_CLIENT_ID || 'dummy' }}
        EOF

    - name: Build with Gradle
      run: ./gradlew :app:assembleRelease -x lintVitalRelease

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: app/build/outputs/apk/release/app-release-unsigned.apk
