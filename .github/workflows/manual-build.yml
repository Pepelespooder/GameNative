name: Manual Build

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    - name: Validate Gradle wrapper
      uses: gradle/actions/wrapper-validation@v4
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Inject credentials
      run: |
        cat <<EOF > local.properties
        POSTHOG_API_KEY=${{ secrets.POSTHOG_API_KEY || 'dummy' }}
        POSTHOG_HOST=${{ secrets.POSTHOG_HOST || 'https://us.i.posthog.com' }}
        STEAMGRIDDB_API_KEY=${{ secrets.STEAMGRIDDB_API_KEY || 'dummy' }}
        CLOUD_PROJECT_NUMBER=${{ secrets.CLOUD_PROJECT_NUMBER || '0' }}
        ITCH_IO_CLIENT_ID=${{ secrets.ITCH_IO_CLIENT_ID || 'dummy' }}
        EOF

    - name: Build with Gradle
      run: ./gradlew :app:bundleRelease

    - name: Install Android SDK Build Tools
      run: |
        SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
        if [ ! -x "$SDKMANAGER" ]; then
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
        fi
        yes | "$SDKMANAGER" --install "build-tools;34.0.0"

    - name: Extract APK from Bundle
      run: |
        java -jar tools/bundletool-all-1.17.2.jar build-apks --bundle=app/build/outputs/bundle/release/app-release.aab --output=app-release.apks --mode=universal
        unzip -o app-release.apks universal.apk

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: universal.apk
